# Ultralytics 🚀 AGPL-3.0 License
# YOLOv8-tinyUAV: P2/4-P4/16 only (P5 removed per YOLO-Drone paper); built from yolov8-p2.yaml
# Scale is read from the file name (yolov8s-...). imgsz must be a multiple of 16 (max stride).

nc: 3  # AirSim drones: bayraktar_tb2, geran, mq9_reaper
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, SPPF, [1024, 5]] # 7

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 8
  - [[-1, 4], 1, Concat, [1]] # 9  cat backbone P3
  - [-1, 3, C2f, [256]] # 10 (P3 neck)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 2], 1, Concat, [1]] # 12  cat backbone P2
  - [-1, 3, C2f, [128]] # 13 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]] # 14
  - [[-1, 10], 1, Concat, [1]] # 15  cat head P3
  - [-1, 3, C2f, [256]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 7], 1, Concat, [1]] # 18  cat SPPF (P4)
  - [-1, 3, C2f, [512]] # 19 (P4/16-medium)

  - [[13, 16, 19], 1, Detect, [nc]] # Detect(P2, P3, P4)