# YOLO-FIRI for the 3-class AirSim dataset.
# Same architecture as the original yolov5-FIRI.yaml.
# only nc and the anchors differ.
nc: 3  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple

# anchors (pixels at the training image size). Original FLIR anchors kept until you run
#   python compute_anchors.py --labels <root>/labels/train --img-size 1280 --write models/yolov5-FIRI-3cls.yaml
anchors:
  - [108,52, 137,91, 182,146]  # P2/4
  - [263,116, 274,186, 422,187]  # P3/8
  - [372,295, 570,274, 529,393]  # P4/16
  - [633,477, 855,389, 968,617]  # P5/32

# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Focus, [64, 3, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 9, C3, [128]],  # 2
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 9, C3, [256]],  # 4
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512]],  # 6
   [-1, 1, SELayer, [512 , 16]],  # 7
   [-1, 1, Conv, [1024, 3, 2]],  # 8-P5/32
   [-1, 1, SPP, [1024, [5, 9, 13]]],  # 9
   [-1, 3, C3, [1024, False]],  # 10
   [-1, 1, SELayer, [1024 , 16]],  # 11
  ]

# YOLOv5 head
head:
  [[-1, 1, Conv, [512, 1, 1]],  # 12
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 13
   [[-1, 6], 1, Concat, [1]],  # 14 cat backbone P4
   [-1, 3, C3, [512, False]],  # 15

   [-1, 1, Conv, [256, 1, 1]],  # 16
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 17
   [[-1, 4], 1, Concat, [1]],  # 18 cat backbone P3
   [-1, 3, C3, [256, False]],  # 19

   [-1, 1, Conv, [128, 1, 1]],  # 20
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  # 21
   [[-1, 2], 1, Concat, [1]],  # 22 cat backbone P2
   [-1, 3, C3, [128, False]],  # 23 (P2/4-mini)

   [-1, 1, Conv, [128, 1, 2]],  # 24
   [[-1, 4], 1, Concat, [1]],  # 25 cat backbone P3
   [-1, 3, C3, [256, False]],  # 26 (P3/8-small)

   [-1, 1, Conv, [256, 1, 2]],  # 27
   [[-1, 16], 1, Concat, [1]],  # 28 cat head P4
   [-1, 3, C3, [512, False]],  # 29 (P4/16-medium)

   [-1, 1, Conv, [512, 1, 2]],  # 30
   [[-1, 12], 1, Concat, [1]],  # 31 cat head P5
   [-1, 3, C3,[1024, False]],  # 32 (P5/32-large)

   [[23, 26, 29, 32], 1, Detect, [nc, anchors]],  # 33 Detect(P2, P3, P4, P5)
  ]
